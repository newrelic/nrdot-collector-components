name: 🔄 Lint | Renovate
on:
  pull_request:
    paths:
      - "renovate.json"

permissions:
  contents: read

jobs:
  renovate-config-validator:
    name: Renovate config validator
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Test that the config is valid
        run: |
          # renovate: datasource=docker
          export RENOVATE_IMAGE=ghcr.io/renovatebot/renovate:44.26.0@sha256:eca4654d90229b8a87323c9a13154d8a0f3b0d398b9b7da036fef662601eaff2
          docker run --rm --entrypoint "renovate-config-validator" \
            -v "${{ github.workspace }}/renovate.json":"/renovate.json" \
            "${RENOVATE_IMAGE}" "/renovate.json"
