name: Push Release Tags

on:
  workflow_call:
    inputs:
      version:
        description: 'Version to tag (e.g., 0.140.0 - without v prefix)'
        required: true
        type: string
      commit:
        description: 'Optional: Commit SHA to tag'
        required: false
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to tag (e.g., 0.140.0 - without v prefix)'
        required: true
        type: string
      commit:
        description: 'Optional: Commit SHA to tag'
        required: false
        type: string

permissions:
  contents: read

jobs:
  push-tags:
    permissions:
      contents: write # required for creating and pushing tags
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # need full history to find the commit
          token: ${{ secrets.RELEASE_TOKEN }}

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: oldstable
          cache: false

      - name: Verify version format
        run: |
          if ! [[ "${{ inputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+.*$ ]]; then
            echo "Error: Version must follow semver format without 'v' prefix (e.g., 0.140.0)"
            exit 1
          fi
          echo "Using provided version: ${{ inputs.version }}"

      - name: Find release commit
        id: find-commit
        run: |
          COMMIT="${{ inputs.commit }}"
          if [ -n "$COMMIT" ]; then
            echo "Using provided commit SHA: $COMMIT"
          else
            echo "No commit provided; resolving from versions.yaml"
            COMMIT=$(git log --all -G "version: v${{ inputs.version }}" --format="%H" -- versions.yaml | head -n 1)
          fi
          [ -z "$COMMIT" ] && { echo "Error: Could not find commit for v${{ inputs.version }}"; exit 1; }
          git show $COMMIT:versions.yaml | grep -q "version: v${{ inputs.version }}" || { echo "Error: Commit doesn't contain v${{ inputs.version }}"; exit 1; }
          echo "commit=$COMMIT" >> $GITHUB_OUTPUT

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true
          git_tag_gpgsign: true

      - name: Push tags
        if: ${{ !env.ACT }}
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Use the commit we found
          make push-tags MODSET=beta COMMIT=${{ steps.find-commit.outputs.commit }} REMOTE=origin

          echo "✅ Successfully pushed all module tags for version ${{ inputs.version }}"
          echo ""
          echo "Tags pushed:"
          git tag -l "*${{ inputs.version }}"

      - name: Send notification to Slack
        if: ${{ failure() && !env.ACT }}
        uses: slackapi/slack-github-action@0bc3581177d9a0f8d555e07689384b376528e8fa # v4.1.0
        with:
          webhook: ${{ secrets.AC_SLACK_WEBHOOK }}
          webhook-type: incoming-webhook
          payload: |
            text: ":rotating_light: push-release-tags workflow failed - https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }} :rotating_light:"
