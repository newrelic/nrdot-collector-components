# Use this changelog template to create an entry for release notes.

# One of 'breaking', 'deprecation', 'new_component', 'enhancement', 'bug_fix'
change_type: bug_fix

# The name of the component, or a single word describing the area of concern, (e.g. receiver/filelog)
component: processor/adaptivetelemetry

# A brief description of the change.  Surround your text with quotes ("") if it needs to start with a backtick (`).
note: Read integer data points correctly, so thresholds, anomaly detection and dynamic thresholds work on integer metrics such as `process.memory.usage`.

# Mandatory: One or more tracking issues related to the change. You can use the PR number here if no issue exists.
issues: [418]

# (Optional) One or more lines of additional information to render under the primary note.
# These lines will be padded with 2 spaces and then inserted directly into the document.
# Use pipe (|) for multiline entries.
subtext: |
  Integer data points were read as 0, so thresholds on `process.memory.usage`, `process.memory.virtual`,
  `process.disk.io`, `system.memory.usage` and `system.network.io` never triggered. Configs with those
  thresholds will now keep the processes that exceed them.
  Dynamic thresholds now also learn from non-monotonic sums such as `process.memory.usage`. Monotonic sums
  such as `process.disk.io` are running totals and still do not move dynamic thresholds.
  When the processor runs before `cumulativetodelta`, `process.disk.io` is the total since the process
  started, so a static threshold on it keeps a process from the moment its lifetime total crosses the threshold.

